# ADP tools catalog (adp-tools-catalog-v1). Open source only, installed with Helm by the Tools Agent.
# Same charts, repositories and versions on every cloud; only values/<cloud>/ differ.
# required: true  -> always installed (GP04 mandatory); false -> only when the team selects it.
# workloads: what each release creates (detection without reading Helm's release Secrets).
# version_from: workload + label whose value must equal "<chart>-<version>" (omitted = not verifiable).
schema: adp-tools-catalog-v1
repositories:
  argo: https://argoproj.github.io/argo-helm
  jetstack: https://charts.jetstack.io
  kyverno: https://kyverno.github.io/kyverno/
  hashicorp: https://helm.releases.hashicorp.com
  prometheus-community: https://prometheus-community.github.io/helm-charts
  open-telemetry: https://open-telemetry.github.io/opentelemetry-helm-charts
  istio: https://istio-release.storage.googleapis.com/charts
  gatekeeper: https://open-policy-agent.github.io/gatekeeper/charts
  fluxcd-community: https://fluxcd-community.github.io/helm-charts
  external-secrets: https://charts.external-secrets.io
tools:
  - id: argo-cd
    title: Argo CD
    required: true
    order: 10
    clouds: [aws, azure]
    releases:
      - release: argocd
        namespace: argocd
        repository: argo
        chart: argo-cd
        version: 10.18.0
        values: argo-cd
        workloads:
          - {kind: Deployment, name: argocd-server}
          - {kind: Deployment, name: argocd-repo-server}
          - {kind: Deployment, name: argocd-applicationset-controller}
          - {kind: Deployment, name: argocd-redis}
          - {kind: StatefulSet, name: argocd-application-controller}
        version_from: {workload: argocd-server, label: helm.sh/chart}
  - id: cert-manager
    title: cert-manager
    required: true
    order: 20
    clouds: [aws, azure]
    releases:
      - release: cert-manager
        namespace: cert-manager
        repository: jetstack
        chart: cert-manager
        version: v1.21.3
        values: cert-manager
        workloads:
          - {kind: Deployment, name: cert-manager}
          - {kind: Deployment, name: cert-manager-webhook}
          - {kind: Deployment, name: cert-manager-cainjector}
        version_from: {workload: cert-manager, label: helm.sh/chart}
  - id: istio
    title: Istio
    required: false
    order: 25
    clouds: [aws, azure]
    releases:
      - release: istio-base
        namespace: istio-system
        repository: istio
        chart: base
        version: 1.30.8
        values: istio-base
        workloads: []
      - release: istiod
        namespace: istio-system
        repository: istio
        chart: istiod
        version: 1.30.8
        values: istiod
        workloads:
          - {kind: Deployment, name: istiod}
        version_from: {workload: istiod, label: helm.sh/chart}
  - id: kyverno
    title: Kyverno
    required: true
    order: 30
    clouds: [aws, azure]
    releases:
      - release: kyverno
        namespace: kyverno
        repository: kyverno
        chart: kyverno
        version: 3.10.0
        values: kyverno
        workloads:
          - {kind: Deployment, name: kyverno-admission-controller}
          - {kind: Deployment, name: kyverno-background-controller}
          - {kind: Deployment, name: kyverno-cleanup-controller}
          - {kind: Deployment, name: kyverno-reports-controller}
        version_from: {workload: kyverno-admission-controller, label: helm.sh/chart}
  - id: gatekeeper
    title: OPA Gatekeeper
    required: false
    order: 35
    clouds: [aws, azure]
    releases:
      - release: gatekeeper
        namespace: gatekeeper-system
        repository: gatekeeper
        chart: gatekeeper
        version: 3.23.1
        values: gatekeeper
        workloads:
          - {kind: Deployment, name: gatekeeper-controller-manager}
          - {kind: Deployment, name: gatekeeper-audit}
        version_from: {workload: gatekeeper-controller-manager, label: helm.sh/chart}
  - id: vault
    title: Vault (cliente)
    required: true
    order: 40
    clouds: [aws, azure]
    releases:
      - release: vault
        namespace: vault
        repository: hashicorp
        chart: vault
        version: 0.34.1
        values: vault
        workloads:
          - {kind: Deployment, name: vault-agent-injector}
  - id: external-secrets
    title: External Secrets Operator
    required: false
    order: 45
    clouds: [aws, azure]
    releases:
      - release: external-secrets
        namespace: external-secrets
        repository: external-secrets
        chart: external-secrets
        version: 2.15.0
        values: external-secrets
        workloads:
          - {kind: Deployment, name: external-secrets}
          - {kind: Deployment, name: external-secrets-webhook}
          - {kind: Deployment, name: external-secrets-cert-controller}
        version_from: {workload: external-secrets, label: helm.sh/chart}
  - id: kube-prometheus-stack
    title: Prometheus y Grafana
    required: true
    order: 50
    clouds: [aws, azure]
    releases:
      - release: kube-prometheus-stack
        namespace: monitoring
        repository: prometheus-community
        chart: kube-prometheus-stack
        version: 93.4.0
        values: kube-prometheus-stack
        workloads:
          - {kind: Deployment, name: kube-prometheus-stack-operator}
          - {kind: Deployment, name: kube-prometheus-stack-grafana}
          - {kind: Deployment, name: kube-prometheus-stack-kube-state-metrics}
          - {kind: DaemonSet, name: kube-prometheus-stack-prometheus-node-exporter}
        version_from: {workload: kube-prometheus-stack-operator, label: chart}
  - id: opentelemetry-operator
    title: OpenTelemetry
    required: true
    order: 60
    clouds: [aws, azure]
    depends_on: [cert-manager]
    releases:
      - release: opentelemetry-operator
        namespace: opentelemetry-operator-system
        repository: open-telemetry
        chart: opentelemetry-operator
        version: 0.129.1
        values: opentelemetry-operator
        workloads:
          - {kind: Deployment, name: opentelemetry-operator}
        version_from: {workload: opentelemetry-operator, label: helm.sh/chart}
  - id: flux
    title: Flux
    required: false
    order: 70
    clouds: [aws, azure]
    releases:
      - release: flux2
        namespace: flux-system
        repository: fluxcd-community
        chart: flux2
        version: 2.20.0
        values: flux2
        workloads:
          - {kind: Deployment, name: source-controller}
          - {kind: Deployment, name: kustomize-controller}
          - {kind: Deployment, name: helm-controller}
          - {kind: Deployment, name: notification-controller}
        version_from: {workload: source-controller, label: helm.sh/chart}
