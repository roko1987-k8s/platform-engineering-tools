# EXAMPLE (not applied). Mesh-wide Telemetry in the root namespace: inherited by every workload.
# Fill in, rename to telemetry.yaml and add it to kustomization.yaml.
apiVersion: telemetry.istio.io/v1
kind: Telemetry
metadata:
  name: mesh-default
  namespace: istio-system
spec:
  accessLogging:
    - providers:
        - name: envoy # built-in provider: access logs to the proxy's stdout
