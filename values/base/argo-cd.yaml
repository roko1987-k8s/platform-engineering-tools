# Argo CD per cluster, installed by the Tools Agent. It syncs only this cluster's folder of the gitops repo
# (pull over the VPC NAT). The root Application, the AppProject and the gitops repository credential are
# created by the agent outside this release (never stored in this public repo).
configs:
  params:
    server.insecure: false
  cm:
    # Health of child Applications, so sync waves between Applications wait for the previous wave to be Healthy.
    resource.customizations.health.argoproj.io_Application: |
      hs = {}
      hs.status = "Progressing"
      hs.message = ""
      if obj.status ~= nil and obj.status.health ~= nil then
        hs.status = obj.status.health.status
        if obj.status.health.message ~= nil then
          hs.message = obj.status.health.message
        end
      end
      return hs
dex:
  enabled: false
notifications:
  enabled: false
