# EKS: internal NLB created by the AWS Load Balancer Controller (pods as IP targets).
# Requires the AWS Load Balancer Controller (tool aws-load-balancer-controller) and the node subnets tagged
# kubernetes.io/role/internal-elb=1 (EKS module eks-v1.7.0).
service:
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: external
    service.beta.kubernetes.io/aws-load-balancer-scheme: internal
    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip
    # Cross-zone on: each NLB node forwards to healthy gateway pods in any zone. Off (the AWS
    # default), the node in a zone without gateway pods resets connections (D010 2026-11-24:
    # both pods on the only user node in 1a, curl refused through the 1b address).
    service.beta.kubernetes.io/aws-load-balancer-attributes: load_balancing.cross_zone.enabled=true
    # The NLB uses the EKS module's <names.sg>-ingress group (rules 103/104), never one
    # created by the controller. Per cluster, the Tools Agent adds its NAME (from the naming):
    #   service.beta.kubernetes.io/aws-load-balancer-security-groups: <names.sg>-ingress
    service.beta.kubernetes.io/aws-load-balancer-manage-backend-security-group-rules: "false"
    # Every target group checks the gateway readiness on the Istio status port (rule 104
    # allows 15021), not its own port: a port without a server (443 until the HTTPS
    # Gateway exists) is not reported unhealthy, and a gateway that is not ready leaves
    # every target group at once.
    service.beta.kubernetes.io/aws-load-balancer-healthcheck-port: "15021"
    service.beta.kubernetes.io/aws-load-balancer-healthcheck-protocol: http
    service.beta.kubernetes.io/aws-load-balancer-healthcheck-path: /healthz/ready
